services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    environment:
      PIPENV_VENV_IN_PROJECT: "1"
    volumes:
      - ..:/workspaces/transbank-sdk-python-example:cached
      - venv:/workspaces/transbank-sdk-python-example/.venv

volumes:
  venv:
